name: generate streak stats card

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: download light and dark streak SVGs
        run: |
          mkdir -p dist
          base="https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=en&mode=daily&hide_border=false&border_radius=5"
          curl -fsSL --retry 3 "$base&background=FFFFFF&border=0A66C2&stroke=0A66C2&ring=0A66C2&fire=0A66C2&currStreakNum=0A66C2&currStreakLabel=0A66C2&sideNums=1F2328&sideLabels=57606A&dates=57606A" -o dist/streak.svg
          curl -fsSL --retry 3 "$base&background=0D1117&border=388BFD&stroke=388BFD&ring=388BFD&fire=388BFD&currStreakNum=58A6FF&currStreakLabel=58A6FF&sideNums=E6EDF3&sideLabels=8B949E&dates=8B949E" -o dist/streak-dark.svg
          grep -q '<svg' dist/streak.svg && grep -q '<svg' dist/streak-dark.svg

      - name: push SVGs to the streak-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: streak-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
