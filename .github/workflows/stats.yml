name: generate github stats cards

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATS: username=${{ github.repository_owner }}&hide_rank=true&show_icons=true&include_all_commits=true&count_private=true&locale=en&border_radius=5
      LANGS: username=${{ github.repository_owner }}&layout=compact&card_width=320&langs_count=10&locale=en&border_radius=5
      LIGHT: bg_color=FFFFFF&border_color=0A66C2&title_color=0A66C2&icon_color=0A66C2&text_color=1F2328
      DARK: bg_color=0D1117&border_color=388BFD&title_color=58A6FF&icon_color=388BFD&text_color=E6EDF3
    steps:
      - name: generate light stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.LIGHT }}
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: generate dark stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: ${{ env.STATS }}&${{ env.DARK }}
          path: dist/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: generate light languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.LIGHT }}
          path: dist/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: generate dark languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: ${{ env.LANGS }}&${{ env.DARK }}
          path: dist/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: push SVGs to the stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
